name = "query-language"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QueryLanguage"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

[[require]]
name = "leansqlite"
git = "https://github.com/leanprover/leansqlite"
rev = "b61f1cfac14d03094cb3c0e65acd504416e47cad"

[[lean_lib]]
name = "QueryLanguage"
