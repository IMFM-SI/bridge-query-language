[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathql-mcp"
version = "0.1.0"
description = "MCP server exposing MathQL queries over databases of mathematical objects"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "networkx",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff"]

[project.scripts]
mathql-mcp = "mathql_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mathql_mcp"]

[tool.ruff]
line-length = 95

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true
