name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the package and its dev tools
        working-directory: python
        run: pip install -e '.[dev]'
      - name: ruff
        working-directory: python
        run: ruff check .
      - name: mypy
        working-directory: python
        run: mypy src generate_graphs.py
      - name: pytest
        working-directory: python
        run: pytest -q
